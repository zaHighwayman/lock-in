name = "lock-in-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Daily Withings + Oura pull at 05:30 UTC (08:30 Helsinki in summer, 07:30 in winter).
[triggers]
crons = ["30 5 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "lock-in"
database_id = "903091cf-ce38-4827-97c2-b570e1a1668c"
migrations_dir = "migrations"

[vars]
# Where the app is hosted (CORS + OAuth return).
ALLOWED_ORIGIN = "https://zahighwayman.github.io"

# Secrets (set with `npx wrangler secret put NAME`, never committed):
#   SYNC_TOKEN               long random string; the one-time setup code for the first (admin) account
#   TOKEN_KEY                another long random string, encrypts OAuth tokens at rest
#   WITHINGS_CLIENT_ID / WITHINGS_CLIENT_SECRET
#   OURA_CLIENT_ID / OURA_CLIENT_SECRET
